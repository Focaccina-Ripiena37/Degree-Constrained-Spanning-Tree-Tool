name: Build DCST Tool

on:
  push:
    tags:
      - 'v*'  # Esegue solo al push di un tag tipo v1.0.0

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pyinstaller
      - name: Build EXE
        run: pyinstaller --onefile --windowed --icon=icon.ico --name DCST_Tool run.py
      - uses: actions/upload-artifact@v2
        with:
          name: dcst-windows
          path: dist/DCST_Tool.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pyinstaller
      - name: Build macOS
        run: pyinstaller --onefile --windowed --icon=icon.icns --name DCST_Tool run.py
      - uses: actions/upload-artifact@v2
        with:
          name: dcst-macos
          path: dist/DCST_Tool

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pyinstaller
      - name: Build Linux
        run: pyinstaller --onefile --windowed --name DCST_Tool run.py
      - uses: actions/upload-artifact@v2
        with:
          name: dcst-linux
          path: dist/DCST_Tool
